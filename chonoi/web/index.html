<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0e1820; color: #fdf5e6;
    font: 14px/1.4 "Segoe UI", "Nunito", system-ui, sans-serif; overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" aria-label="Quán Ăn Chợ Nổi"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (Ghibli Anime UI). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const demo = new URLSearchParams(location.search).get("demo");
const demoStates = {
  pickup: { stove: "ready", seconds: 8, hand: null, target: { id: "B1", action: "dish_picked" } },
  serve: { stove: "idle", seconds: 6, hand: "lau_ca_linh_dien_dien", target: { id: "T1", action: "served" } },
  missing: { stove: "idle", seconds: 30, hand: null, target: null, missing: { bong_dien_dien: 1 } },
};

function previewState(state) {
  if (state.mode === "gather" && (demo === "fish" || demo === "plants")) {
    const fish = demo === "fish";
    const target = fish ? state.fish[0] : state.nodes[1];
    const harvested = state.nodes[0];
    if (!target || !harvested) return state;
    return {
      ...state,
      preview: true,
      finished: false,
      time_left_ticks: 25 * 60,
      player: { ...state.player, pos: [target.pos[0] - 1, target.pos[1]], at_surface: !fish },
      catch_target_id: fish ? target.id : null,
      harvest_target_id: fish ? null : target.id,
      nodes: state.nodes.map((node) => node.id === harvested.id
        ? { ...node, ready: false, regrow_ticks: 12 * 60 } : node),
      events: [{ name: "gather", tick: state.tick, data: { kind: harvested.kind, quantity: 1, pos: harvested.pos } }],
    };
  }
  if (state.mode !== "quan" || !Object.hasOwn(demoStates, demo)) return state;
  const example = demoStates[demo];
  const dish = "lau_ca_linh_dien_dien";
  return {
    ...state,
    preview: true,
    finished: false,
    time_left_ticks: 90 * 60,
    hand: example.hand,
    interact_target: example.target,
    stoves: state.stoves.map((stove) => stove.id === "B1"
      ? { ...stove, state: example.stove, dish: example.stove === "ready" ? dish : null } : stove),
    customers: [{ table_id: "T1", dish_id: dish, state: "waiting", patience_ticks_left: example.seconds * 60 }],
    stock: { ca_linh: 3, bong_sung: 2 },
    events: example.missing
      ? [{ name: "cook_blocked", tick: state.tick, data: { stove_id: "B1", missing: example.missing } }] : [],
  };
}

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  // Trong chế độ day, phase cho biết cảnh đang chơi.
  const phase = snap?.phase ?? snap?.mode;
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  // Trong quán, z tăng theo hướng lên. Khi lặn, độ sâu tăng theo hướng xuống.
  if (phase === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
let showMainMenu = !demo;
let dismissedIntroKey = "";
let uiButtons = [];

// Chế độ tương phản cao (TICKET-04, AC-P4-07): phím H hoặc ?contrast=high|normal.
// Chỉ đổi cách vẽ ở client, không gửi gì lên server nên không ảnh hưởng headless/JSONL.
const contrastParam = new URLSearchParams(location.search).get("contrast");
let highContrast = contrastParam === "high";
if (contrastParam === null) {
  try { highContrast = localStorage.getItem("chonoi.contrast") === "high"; } catch (e) { /* trình duyệt chặn storage */ }
}
const HC_WARN = "#ffeb3b";
function applyContrast() { cv.style.filter = highContrast ? "contrast(1.25) saturate(1.15)" : ""; }
function toggleContrast() {
  highContrast = !highContrast;
  try { localStorage.setItem("chonoi.contrast", highContrast ? "high" : "normal"); } catch (e) { /* bỏ qua */ }
  applyContrast();
}
applyContrast();

async function sendAction(payload) {
  try {
    await fetch("/input", {
      method: "POST",
      body: JSON.stringify(payload),
      headers: { "Content-Type": "application/json" },
    });
  } catch (e) { /* mất kết nối: poll sẽ báo */ }
}

function togglePause() {
  if (!snap || snap.finished || showMainMenu) return;
  down.clear();
  lastSent = "";
  sendAction({ move: [0, 0], interact: false, catch: false, pause: true }).then(() => sendAction({ pause: false }));
}

function buyUpgrade(kind) {
  if (!snap || snap.phase !== "shop") return;
  sendAction({ buy: kind });
}

function finishShop() {
  if (!snap || snap.phase !== "shop") return;
  sendAction({ shop_done: true }).then(() => sendAction({ shop_done: false }));
}

addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === "h" && !e.repeat) { toggleContrast(); e.preventDefault(); return; }
  if (snap?.preview) return;
  if (showMainMenu) {
    if (k === "enter" || k === " ") { showMainMenu = false; e.preventDefault(); }
    return;
  }
  if (k === "escape" || k === "p") {
    togglePause();
    e.preventDefault();
    return;
  }
  if (snap?.state === "paused") {
    if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
    return;
  }
  if (snap?.phase === "shop" && !snap.finished) {
    if (k === "1") { buyUpgrade("oxygen"); return; }
    if (k === "2") { buyUpgrade("hp"); return; }
    if (k === "e" || k === "enter") { finishShop(); return; }
  }
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e" && snap?.can_open_quan) {
    down.clear();
    lastSent = "";
    fetch("/continue", { method: "POST" });
    return;
  }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  if (snap?.preview) return;
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); if (!snap?.preview) pushInput(); });
cv.addEventListener("click", (e) => {
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      b.onClick();
      return;
    }
  }
});

// ---------- ra: poll snapshot & làm mượt chuyển động ----------
const smoothMap = new Map();
let lastPollMode = "", lastPollTick = -1;

function smoothPos(key, target, alpha) {
  if (!target || reducedMotion.matches || alpha >= 1) {
    const p = [target[0], target[1]];
    smoothMap.set(key, p);
    return p;
  }
  const cur = smoothMap.get(key);
  if (!cur || Math.hypot(target[0] - cur[0], target[1] - cur[1]) > 4) {
    const p = [target[0], target[1]];
    smoothMap.set(key, p);
    return p;
  }
  cur[0] += (target[0] - cur[0]) * alpha;
  cur[1] += (target[1] - cur[1]) * alpha;
  return cur;
}

async function poll() {
  const t0 = performance.now();
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const next = previewState(await r.json());
    if (next.mode !== lastPollMode || next.tick < lastPollTick) {
      smoothMap.clear();
    }
    lastPollMode = next.mode;
    lastPollTick = next.tick ?? -1;
    const wasInQuan = (snap?.phase ?? snap?.mode) === "quan";
    const isInQuan = (next.phase ?? next.mode) === "quan";
    snap = next;
    offline = false;
    // Gửi lại hướng dọc nếu người chơi giữ phím trong lúc chuyển pha.
    if (!next.preview && wasInQuan !== isInQuan && (down.has("u") || down.has("d"))) {
      pushInput();
    }
  } catch (e) { offline = true; }
  setTimeout(poll, Math.max(0, 16 - (performance.now() - t0)));
}
poll();

// ---------- bảng màu & tiện ích vẽ Ghibli ----------
const KIND_COLOR = {
  ca_loc: "#769a5c", ca_linh: "#dcecf7", ca_keo: "#d99b5e",
  bong_dien_dien: "#f7cc46", bong_sung: "#f07c9e", keo_neo: "#8fcf6b"
};
const KIND_NAME = {
  ca_loc: "Cá lóc", ca_linh: "Cá linh", ca_keo: "Cá kèo",
  bong_dien_dien: "Điên điển", bong_sung: "Bông súng", keo_neo: "Kèo nèo"
};
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
};
const kc = (k) => KIND_COLOR[k] || "#d7ccc8";
const dishName = (id) => DISH_NAME[id] || id;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const OUTLINE = "#2c1e16";

// Bọt khí trang trí cho màn gather
const BUBBLES = Array.from({ length: 24 }, (_, i) => ({
  x: (i * 4.3 + 2) % 100,
  speed: 0.4 + (i % 5) * 0.18,
  r: 2 + (i % 4) * 1.1,
  phase: i * 1.3,
}));

const gradCache = { key: "", sky: null, water: null, rays: [], night: null, floor: null };
function getGatherGrads(w, h, oy, syD, sx0, X, s) {
  const key = `g:${w}:${h}:${oy}:${syD}`;
  if (gradCache.key === key) return gradCache;
  gradCache.key = key;
  const sky = ctx.createLinearGradient(0, HUD_TOP, 0, oy);
  sky.addColorStop(0, "#8bc6d9");
  sky.addColorStop(0.55, "#d8ebd0");
  sky.addColorStop(1, "#f9e3ad");
  gradCache.sky = sky;

  const water = ctx.createLinearGradient(0, oy, 0, syD);
  water.addColorStop(0, "#4ea8a1");
  water.addColorStop(0.45, "#246670");
  water.addColorStop(1, "#0d252e");
  gradCache.water = water;

  gradCache.rays = [];
  for (let r = 0; r < 5; r++) {
    const rx = sx0 + (12 + r * 20) * s;
    const ray = ctx.createLinearGradient(rx, oy, rx + 50, syD * 0.75);
    ray.addColorStop(0, "rgba(255, 246, 195, 0.16)");
    ray.addColorStop(1, "rgba(255, 246, 195, 0)");
    gradCache.rays.push({ rx, ray });
  }
  return gradCache;
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function text(s, x, y, o = {}) {
  ctx.font = (o.weight || 500) + " " + (o.size || 14) + "px 'Segoe UI', system-ui, sans-serif";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  // Tương phản cao: chữ sáng luôn có viền đen dày để nổi trên mọi nền.
  const hcOutline = highContrast && isLightColor(o.color || "#fdf5e6");
  if (o.outline || hcOutline) {
    ctx.lineWidth = hcOutline ? Math.max(4, o.outlineWidth || 0) : (o.outlineWidth || 3);
    ctx.strokeStyle = hcOutline ? "#000" : o.outline;
    ctx.lineJoin = "round";
    if (o.maxWidth) ctx.strokeText(s, x, y, o.maxWidth);
    else ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = o.color || "#fdf5e6";
  if (o.maxWidth) ctx.fillText(s, x, y, o.maxWidth);
  else ctx.fillText(s, x, y);
}

function pillBar(x, y, w, h, frac, color, label) {
  const f = Math.max(0, Math.min(1, frac));
  ctx.save();
  roundRect(x, y, w, h, h / 2);
  ctx.fillStyle = "rgba(25, 17, 13, 0.7)";
  ctx.fill();
  if (f > 0) {
    ctx.save();
    roundRect(x, y, w, h, h / 2);
    ctx.clip();
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, color);
    grad.addColorStop(1, "rgba(0,0,0,0.22)");
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * f, h);
    // ánh bóng anime phía trên thanh
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.fillRect(x + 2, y + 1.5, Math.max(0, w * f - 4), Math.max(2, h * 0.3));
    ctx.restore();
  }
  roundRect(x, y, w, h, h / 2);
  ctx.strokeStyle = "rgba(255, 240, 210, 0.55)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  if (label) text(label, x + w / 2, y + h - 2.5, { size: 11, weight: 700, align: "center", outline: OUTLINE });
  ctx.restore();
}

function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

const HUD_TOP = 104, HUD_BOTTOM = 86;
const footerHeight = (w) => HUD_BOTTOM + (w < 680 ? 22 : 0);
const hudFont = (w, base = 18) => (w >= 960 ? base : Math.max(13, base - 4));

function drawButton(x, y, w, h, label, bg, border, textColor, onClick, fontSize = 18) {
  ctx.save();
  roundRect(x, y, w, h, 12);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.lineWidth = 2;
  ctx.stroke();
  text(label, x + w / 2, y + h / 2 + fontSize * 0.34, {
    size: fontSize, weight: 700, align: "center", color: textColor, maxWidth: w - 16,
  });
  ctx.restore();
  uiButtons.push({ x, y, w, h, onClick });
}

function hud(w, h, title, accent, summary, controls) {
  const footer = h - footerHeight(w);
  const fz = hudFont(w, 18);
  const hGrad = ctx.createLinearGradient(0, 0, 0, HUD_TOP);
  hGrad.addColorStop(0, "#2f2017");
  hGrad.addColorStop(1, "#221610");
  ctx.fillStyle = hGrad;
  ctx.fillRect(0, 0, w, HUD_TOP);

  const fGrad = ctx.createLinearGradient(0, footer, 0, h);
  fGrad.addColorStop(0, "#241811");
  fGrad.addColorStop(1, "#19100b");
  ctx.fillStyle = fGrad;
  ctx.fillRect(0, footer, w, footerHeight(w));

  ctx.fillStyle = accent;
  ctx.fillRect(0, HUD_TOP - 2.5, w, 2.5);
  ctx.fillRect(0, footer, w, 2.5);

  const dayTag = snap.day ? `Ngày ${snap.day}/${snap.days || 1} · ` : "";
  text(dayTag + title, 16, 32, { size: Math.max(18, fz + 2), weight: 800, color: "#fff5df", maxWidth: w - 230 });

  // Đồng hồ dạng huy hiệu
  const tStr = "⏱ " + fmtTime(snap.time_left_ticks || 0);
  ctx.font = `700 ${fz}px 'Segoe UI', system-ui, sans-serif`;
  const tw = ctx.measureText(tStr).width + 24;
  roundRect(w - tw - 16, 10, tw, 32, 16);
  ctx.fillStyle = "rgba(255, 240, 200, 0.1)";
  ctx.fill();
  ctx.strokeStyle = (snap.time_left_ticks || 0) <= 30 * 60 ? "#ff8a72" : accent;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  text(tStr, w - 16 - tw / 2, 32, { size: fz, weight: 700, align: "center", color: accent });

  text(summary, 16, footer + 30, { size: fz, color: "#ffefc8", weight: 700, maxWidth: w - 32 });
  const rows = w < 680 ? controls : [controls.join("   ·   ")];
  rows.forEach((row, index) => {
    text(row, 16, footer + 60 + index * 22, { size: Math.max(14, fz - 2), color: "#d5c1a5", maxWidth: w - 32 });
  });
}

const itemKind = (it) => (typeof it === "string" ? it : it?.kind);
const itemFresh = (it) => (typeof it === "object" && it !== null && Number.isFinite(it.fresh) ? it.fresh : null);
const spoiledLimit = () => snap?.freshness_spoiled_below ?? 30;
const freshColor = (f) => (f < spoiledLimit() ? "#ff6e54" : f < 60 ? "#ffd54f" : "#81e69b");

function countByKind(coll) {
  const counts = Object.create(null);
  if (Array.isArray(coll)) {
    for (const it of coll) {
      const k = itemKind(it);
      if (k) counts[k] = (counts[k] || 0) + 1;
    }
  } else if (coll && typeof coll === "object") {
    for (const [k, c] of Object.entries(coll)) {
      if (c > 0) counts[k] = c;
    }
  }
  return counts;
}

function itemSummary(coll) {
  const counts = countByKind(coll);
  return Object.entries(counts).filter(([, count]) => count > 0)
    .map(([kind, count]) => `${KIND_NAME[kind] || kind} ×${count}`).join(" · ");
}

function isLightColor(c) {
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c);
  if (!m) return true;
  let hex = m[1];
  if (hex.length === 3) hex = hex.split("").map((d) => d + d).join("");
  const [r, g, b] = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
  return 0.299 * r + 0.587 * g + 0.114 * b > 140;
}

// Cảnh báo (Thủy quái!, Hết hơi!, Sắp rời bàn): ở tương phản cao dùng nền đen, viền vàng dày, chữ to và biểu tượng ⚠.
function warnMarker(label, x, y, w, color, bg) {
  if (!highContrast) { marker(label, x, y, w, color, bg); return; }
  const shown = "⚠ " + label;
  ctx.font = "800 18px 'Segoe UI', system-ui, sans-serif";
  const width = Math.min(ctx.measureText(shown).width + 24, w - 16);
  const left = Math.max(8, Math.min(x - width / 2, w - width - 8));
  const top = Math.max(HUD_TOP + 6, y - 30);
  ctx.save();
  roundRect(left, top, width, 32, 8);
  ctx.fillStyle = "#000";
  ctx.fill();
  ctx.strokeStyle = HC_WARN;
  ctx.lineWidth = 3;
  ctx.stroke();
  text(shown, left + width / 2, top + 23, { size: 18, weight: 800, align: "center", color: HC_WARN, maxWidth: width - 12 });
  ctx.restore();
}

function marker(label, x, y, w, color = "#fff5df", bg = "#352318") {
  ctx.font = "700 12px 'Segoe UI', system-ui, sans-serif";
  const width = Math.min(ctx.measureText(label).width + 18, w - 16);
  const left = Math.max(8, Math.min(x - width / 2, w - width - 8));
  const top = Math.max(HUD_TOP + 6, y - 22);
  ctx.save();
  roundRect(left, top, width, 24, 12);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.stroke();
  text(label, left + width / 2, top + 16, { size: 12, weight: 700, align: "center", color, maxWidth: width - 12 });
  ctx.restore();
}

function drawMainMenu(w, h) {
  ctx.fillStyle = "rgba(12, 18, 24, 0.82)";
  ctx.fillRect(0, 0, w, h);
  const bw = Math.min(580, w - 32), bh = 320;
  const bx = (w - bw) / 2, by = (h - bh) / 2;
  roundRect(bx, by, bw, bh, 22);
  ctx.fillStyle = "#332218";
  ctx.fill();
  ctx.strokeStyle = "#f2c97d";
  ctx.lineWidth = 3;
  ctx.stroke();

  text("QUÁN ĂN CHỢ NỔI", w / 2, by + 64, { size: 32, weight: 800, align: "center", color: "#fff5df" });
  text("Phiên bản Anime · Sông nước miền Tây", w / 2, by + 100, { size: 18, weight: 600, align: "center", color: "#ffd68b" });
  text("WASD / Mũi tên: Di chuyển · E: Hái / Cập bến / Nấu & Phục vụ", w / 2, by + 152, { size: 18, align: "center", color: "#e8dfd1", maxWidth: bw - 36 });
  text("Space: Bắt cá · Esc / P: Tạm dừng · R: Chơi lại · H: Tương phản cao", w / 2, by + 186, { size: 18, align: "center", color: "#e8dfd1", maxWidth: bw - 36 });

function drawPhaseIntro(w, h) {
  if (!snap || snap.preview || snap.finished || snap.state === "paused" || showMainMenu) return;
  if (snap.phase !== "gather" && snap.phase !== "quan") return;
  const pt = snap.phase_tick ?? snap.tick ?? 0;
  const key = `${snap.day || 1}:${snap.phase}`;
  if (pt > 180 || dismissedIntroKey === key) return;
  const bw = Math.min(580, w - 32), bh = 132;
  const bx = (w - bw) / 2, by = HUD_TOP + 16;
  ctx.save();
  roundRect(bx, by, bw, bh, 16);
  ctx.fillStyle = "rgba(38, 25, 18, 0.92)";
  ctx.fill();
  ctx.strokeStyle = snap.phase === "gather" ? "#9ce3cf" : "#ffd68b";
  ctx.lineWidth = 2;
  ctx.stroke();
  const title = snap.phase === "gather"
    ? `DayIntro · Buổi sáng Ngày ${snap.day || 1}`
    : `EveningIntro · Buổi tối Mở quán Ngày ${snap.day || 1}`;
  text(title, w / 2, by + 40, { size: 22, weight: 800, align: "center", color: "#fff5df" });
  const sub = snap.phase === "gather" && snap.day_plan?.dishes
    ? "Thực đơn: " + Object.entries(snap.day_plan.dishes).map(([d, c]) => `${dishName(d)} ×${c}`).join(", ")
    : "Đón khách, nấu bếp và phục vụ đúng món trước khi hết kiên nhẫn!";
  text(sub, w / 2, by + 76, { size: 18, align: "center", color: "#ffd68b", maxWidth: bw - 28 });
  text("Nhấp vào đây để ẩn", w / 2, by + 110, { size: 15, align: "center", color: "#d5c1a5" });
  ctx.restore();
  uiButtons.push({ x: bx, y: by, w: bw, h: bh, onClick: () => { dismissedIntroKey = key; } });
}

function overlay(w, h) {
  if (offline) marker("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 34, w, "#ff9e80", "#4a1c17");
  if (snap.error) marker("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 60, w, "#ff9e80", "#4a1c17");
  if (showMainMenu) {
    drawMainMenu(w, h);
    return;
  }
  if (snap.state === "paused") {
    drawPauseMenu(w, h);
    return;
  }
  drawPhaseIntro(w, h);
  if (snap.finished) {
    const isDay = snap.mode === "day";
    const gather = snap.mode === "gather";
    const width = Math.min(540, w - 32);
    const height = isDay ? 256 : 216;
    const reason = {
      time: "Hết giờ", docked: "Đã cập bến an toàn",
      fainted: "Út Sen bị ngất", days_complete: `Hoàn thành ${snap.days || 1} ngày!`,
    };
    const end = (snap.events || []).findLast((event) => event.name === (gather ? "gather_end" : "quan_end"));
    const items = end?.data?.inventory?.items;
    const summary = gather
      ? (items && itemSummary(items)) || "Giỏ trống"
      : `Tiền ${snap.money ?? 0}k · Uy tín ${(snap.reputation ?? 0).toFixed(1)} · Điểm ${snap.score ?? 0}`;
    ctx.fillStyle = "rgba(12, 16, 20, 0.72)";
    ctx.fillRect(0, 0, w, h);
    const bx = (w - width) / 2, by = h / 2 - height / 2;
    roundRect(bx, by, width, height, 20);
    ctx.fillStyle = "#362419";
    ctx.fill();
    ctx.strokeStyle = "#f2c97d";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    const title = isDay ? "Summary · Tổng kết hành trình"
      : gather ? "DayResult · Kết thúc buổi sáng" : "DayResult · Kết thúc buổi tối";
    text(title, w / 2, by + 48, { align: "center", weight: 800, size: 24, color: "#fff5df" });
    text(reason[snap.reason] || "", w / 2, by + 84, { align: "center", size: 18, weight: 700, color: "#ffd68b" });
    text(summary, w / 2, by + 120, { align: "center", size: 18, color: "#e8f5e9", maxWidth: width - 32 });
    if (isDay && snap.upgrades) {
      text(`Nâng cấp: Oxy Lv.${snap.upgrades.oxygen || 0} · Máu Lv.${snap.upgrades.hp || 0}`,
        w / 2, by + 156, { align: "center", size: 18, color: "#9ce3cf" });
    }
    text(snap.can_open_quan ? "[E] Mở quán với kho vừa thu thập" : "Nhấn [R] để chơi lại",
      w / 2, by + height - 32, { align: "center", size: 18, weight: 700, color: "#a5ded0", maxWidth: width - 32 });
    return;
  }
  const spoiledEv = (snap.events || []).findLast((event) => event.name === "spoiled" && snap.tick - event.tick < 150);
  if (spoiledEv) {
    const ids = spoiledEv.data?.ids || spoiledEv.data?.item_ids || (spoiledEv.data?.id ? [spoiledEv.data.id] : []);
    const tag = ids.length ? ` (${ids.join(", ")})` : "";
    marker(`Hàng bị ươn${tag}!`, w / 2, 54, w, "#ff8a72", "#4a1c17");
  }
  const messages = { gather: "Đã hái nguyên liệu", fish_caught: "Đã bắt được cá", hold_full: "Giỏ đã đầy!" };
  const recent = (snap.events || []).findLast((event) => Object.hasOwn(messages, event.name));
  if (recent && snap.tick - recent.tick < 120) {
    if (snap.mode === "gather" && gatherReward(recent)) return;
    marker(messages[recent.name], w / 2, h - footerHeight(w) - 14, w,
      recent.name === "hold_full" ? "#ffab91" : "#fff5df");
  }
}

function gatherReward(event) {
  const { pos, kind, count, quantity = count } = event.data || {};
  if ((event.name === "gather" || event.name === "fish_caught")
      && Array.isArray(pos) && pos.length === 2 && pos.every(Number.isFinite)
      && typeof kind === "string" && Number.isFinite(quantity) && quantity > 0) {
    return { pos, label: `+${quantity} ${KIND_NAME[kind] || kind}` };
  }
  return null;
}

function drawCloud(x, y, scale) {
  ctx.save();
  ctx.fillStyle = "rgba(255, 250, 238, 0.72)";
  ctx.beginPath();
  ctx.arc(x, y, 16 * scale, 0, Math.PI * 2);
  ctx.arc(x + 16 * scale, y - 6 * scale, 20 * scale, 0, Math.PI * 2);
  ctx.arc(x + 36 * scale, y, 15 * scale, 0, Math.PI * 2);
  ctx.arc(x + 18 * scale, y + 6 * scale, 16 * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawUtSenSide(px, py, s, headingDeg, underwater, frameTime) {
  ctx.save();
  ctx.translate(px, py);
  const rad = ((headingDeg || 0) * Math.PI) / 180;
  const flip = Math.cos(rad) < -0.15;
  if (flip) ctx.scale(-1, 1);
  // Nghiêng nhẹ theo hướng bơi
  const tilt = underwater ? Math.max(-0.35, Math.min(0.35, Math.sin(rad) * 0.35)) : 0;
  ctx.rotate(tilt);

  const r = 1.05 * s;
  const anim = reducedMotion.matches || snap.finished ? 0 : frameTime;
  const bob = anim ? Math.sin(anim / 200) * 2.2 : 0;
  const kick = anim ? Math.sin(anim / 110) * 0.28 : 0;
  const strokeW = Math.max(1.4, r * 0.055);
  ctx.translate(0, bob);
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  // Chân đạp nước (quần bà ba đen)
  for (const [phase, shade] of [[kick, "#2a2730"], [-kick, "#3d3945"]]) {
    ctx.save();
    ctx.translate(-r * 0.65, r * 0.12);
    ctx.rotate(phase);
    ctx.fillStyle = shade;
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = strokeW;
    ctx.beginPath();
    ctx.ellipse(-r * 0.32, 0, r * 0.36, r * 0.13, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Bàn chân
    ctx.fillStyle = "#f7cfb0";
    ctx.beginPath();
    ctx.arc(-r * 0.68, 0, r * 0.1, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Giỏ tre đeo sau lưng
  ctx.save();
  ctx.translate(-r * 0.45, -r * 0.24);
  ctx.rotate(-0.25);
  ctx.fillStyle = "#c99655";
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = strokeW;
  roundRect(-r * 0.24, -r * 0.24, r * 0.44, r * 0.46, r * 0.08);
  ctx.fill(); ctx.stroke();
  // Nan đan giỏ tre
  ctx.strokeStyle = "rgba(75, 45, 20, 0.55)";
  ctx.lineWidth = strokeW * 0.6;
  ctx.beginPath();
  ctx.moveTo(-r * 0.2, -r * 0.06); ctx.lineTo(r * 0.16, -r * 0.06);
  ctx.moveTo(-r * 0.2, r * 0.08); ctx.lineTo(r * 0.16, r * 0.08);
  ctx.moveTo(-r * 0.02, -r * 0.2); ctx.lineTo(-r * 0.02, r * 0.18);
  ctx.stroke();
  ctx.restore();

  // Tóc đuôi gà bay mềm phía sau
  ctx.save();
  ctx.translate(-r * 0.2, -r * 0.28);
  ctx.rotate(kick * 0.4);
  ctx.fillStyle = "#261d24";
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = strokeW;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-r * 0.42, -r * 0.22, -r * 0.62, r * 0.08);
  ctx.quadraticCurveTo(-r * 0.36, r * 0.18, -r * 0.05, r * 0.06);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // Dây buộc tóc đỏ
  ctx.fillStyle = "#e05a47";
  ctx.beginPath(); ctx.arc(-r * 0.04, 0, r * 0.08, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();

  // Thân áo bà ba xanh ngọc / nâu ấm
  ctx.fillStyle = "#4fa394";
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = strokeW;
  ctx.beginPath();
  ctx.ellipse(-r * 0.24, r * 0.12, r * 0.48, r * 0.28, -0.15, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  // Khăn rằn quàng cổ bay nhẹ
  ctx.fillStyle = "#f2e5d0";
  ctx.beginPath();
  ctx.ellipse(r * 0.04, r * 0.02, r * 0.18, r * 0.14, 0.2, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#b85242";
  ctx.beginPath();
  ctx.moveTo(-r * 0.06, r * 0.04);
  ctx.lineTo(-r * 0.42, r * 0.26 + kick * r * 0.25);
  ctx.lineTo(-r * 0.24, r * 0.34 + kick * r * 0.25);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Tay bơi phía trước
  ctx.save();
  ctx.translate(r * 0.02, r * 0.2);
  ctx.rotate(-kick * 0.9);
  ctx.fillStyle = "#fde0c6";
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = strokeW;
  ctx.beginPath();
  ctx.ellipse(r * 0.24, r * 0.08, r * 0.28, r * 0.11, 0.35, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // Đầu & khuôn mặt anime
  const hx = r * 0.28, hy = -r * 0.18, hr = r * 0.44;
  ctx.fillStyle = "#fde0c6";
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = strokeW;
  ctx.beginPath();
  ctx.arc(hx, hy, hr, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // Mắt anime long lanh + má hồng + nụ cười
  ctx.fillStyle = "#2b1d24";
  ctx.beginPath(); ctx.ellipse(hx + hr * 0.38, hy + hr * 0.02, hr * 0.17, hr * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#5c3b47";
  ctx.beginPath(); ctx.ellipse(hx + hr * 0.38, hy + hr * 0.07, hr * 0.12, hr * 0.14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(hx + hr * 0.43, hy - hr * 0.08, hr * 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + hr * 0.33, hy + hr * 0.12, hr * 0.04, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = "rgba(244, 130, 130, 0.55)";
  ctx.beginPath(); ctx.ellipse(hx + hr * 0.22, hy + hr * 0.35, hr * 0.2, hr * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#9e5347";
  ctx.lineWidth = strokeW * 0.7;
  ctx.beginPath(); ctx.arc(hx + hr * 0.5, hy + hr * 0.36, hr * 0.14, 0.2, Math.PI * 0.85); ctx.stroke();

  // Tóc mái ôm mặt
  ctx.fillStyle = "#261d24";
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = strokeW;
  ctx.beginPath();
  ctx.arc(hx - hr * 0.06, hy - hr * 0.1, hr * 1.02, Math.PI * 0.75, Math.PI * 2.02);
  ctx.quadraticCurveTo(hx + hr * 0.45, hy - hr * 0.32, hx + hr * 0.1, hy - hr * 0.25);
  ctx.quadraticCurveTo(hx - hr * 0.15, hy - hr * 0.1, hx - hr * 0.42, hy + hr * 0.35);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  if (underwater) {
    // Kính lặn + ống thở
    ctx.fillStyle = "#334c57";
    ctx.fillRect(hx - hr * 0.92, hy - hr * 0.18, hr * 1.15, hr * 0.14);
    ctx.fillStyle = "rgba(145, 240, 255, 0.78)";
    ctx.strokeStyle = "#334c57";
    ctx.lineWidth = strokeW;
    roundRect(hx + hr * 0.15, hy - hr * 0.22, hr * 0.56, hr * 0.44, hr * 0.14);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
    ctx.beginPath(); ctx.ellipse(hx + hr * 0.32, hy - hr * 0.08, hr * 0.12, hr * 0.06, -0.4, 0, Math.PI * 2); ctx.fill();
  } else {
    // Nón lá miền Tây có quai nón
    ctx.strokeStyle = "#c45b4d";
    ctx.lineWidth = strokeW * 0.85;
    ctx.beginPath();
    ctx.moveTo(hx - hr * 0.25, hy - hr * 0.55);
    ctx.quadraticCurveTo(hx - hr * 0.05, hy + hr * 0.65, hx + hr * 0.2, hy + hr * 0.85);
    ctx.stroke();

    ctx.fillStyle = "#f2da99";
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = strokeW;
    ctx.beginPath();
    ctx.moveTo(hx - hr * 1.45, hy - hr * 0.45);
    ctx.lineTo(hx + hr * 0.05, hy - hr * 1.65);
    ctx.lineTo(hx + hr * 1.45, hy - hr * 0.38);
    ctx.quadraticCurveTo(hx, hy - hr * 0.22, hx - hr * 1.45, hy - hr * 0.45);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Vòng chỉ trên chóp nón
    ctx.strokeStyle = "rgba(165, 120, 55, 0.45)";
    ctx.lineWidth = strokeW * 0.6;
    ctx.beginPath();
    ctx.moveTo(hx - hr * 0.72, hy - hr * 0.98);
    ctx.lineTo(hx + hr * 0.76, hy - hr * 0.94);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPlantNode(n, x, y, s, ready) {
  ctx.save();
  ctx.globalAlpha = ready ? 1 : 0.38;
  // Lá sen/bèo tròn xanh dịu
  ctx.fillStyle = "#5a9a56";
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(x, y, 0.95 * s, 0.36 * s, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  if (n.kind === "bong_sung") {
    // Hoa bông súng hồng cánh nhọn
    ctx.fillStyle = "#f285a8";
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.ellipse(x + i * 0.16 * s, y - 0.35 * s, 0.18 * s, 0.38 * s, i * 0.24, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = "#ffe082";
    ctx.beginPath(); ctx.arc(x, y - 0.3 * s, 0.14 * s, 0, Math.PI * 2); ctx.fill();
  } else {
    // Chùm bông điên điển vàng rực
    ctx.fillStyle = "#f7cc46";
    for (const [dx, dy] of [[-0.25, -0.3], [0.22, -0.35], [0, -0.55], [-0.1, -0.18], [0.15, -0.18]]) {
      ctx.beginPath();
      ctx.arc(x + dx * s, y + dy * s, 0.2 * s, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawFishAnime(f, x, y, s, canCatch, tailSwing) {
  const fs = s * 0.45;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
  const bodyCol = kc(f.kind);
  ctx.fillStyle = bodyCol;
  ctx.strokeStyle = canCatch ? "#fff0a3" : OUTLINE;
  ctx.lineWidth = canCatch ? 2.4 : 1.4;

  // Đuôi cá mềm mại
  ctx.beginPath();
  ctx.moveTo(-0.72 * fs, 0);
  ctx.lineTo(-1.42 * fs, -0.4 * fs + tailSwing * 0.45);
  ctx.lineTo(-1.24 * fs, tailSwing * 0.18);
  ctx.lineTo(-1.42 * fs, 0.4 * fs + tailSwing * 0.45);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Thân cá + ánh bụng sáng
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.88 * fs, 0.44 * fs, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
  ctx.beginPath();
  ctx.ellipse(0.05 * fs, 0.14 * fs, 0.58 * fs, 0.18 * fs, 0, 0, Math.PI);
  ctx.fill();

  // Mắt anime long lanh
  ctx.fillStyle = "#1a1418";
  ctx.beginPath(); ctx.arc(0.45 * fs, -0.08 * fs, 0.13 * fs, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(0.49 * fs, -0.12 * fs, 0.05 * fs, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

const cam = { x: 10, y: 4, init: false };

function drawMinimap(w, h, X, D, dp, ppos) {
  const mw = Math.min(200, Math.max(130, w * 0.16)), mh = Math.round(mw * (D / X)) + 10;
  const mx = w - mw - 14, my = 54;
  ctx.save();
  roundRect(mx, my, mw, mh, 10);
  ctx.fillStyle = "rgba(16, 30, 38, 0.85)";
  ctx.fill();
  ctx.strokeStyle = "#9ce3cf";
  ctx.lineWidth = 1.6;
  ctx.stroke();

  const tx = (x) => mx + 5 + (x / X) * (mw - 10);
  const ty = (d) => my + 5 + (d / D) * (mh - 10);
  // Bến
  ctx.fillStyle = "#ffd54f";
  ctx.fillRect(tx(dp[0]) - 3, ty(dp[1]) - 2, 6, 5);
  // Nút hái
  for (const n of snap.nodes || []) {
    ctx.fillStyle = n.ready !== false ? kc(n.kind) : "rgba(255,255,255,0.25)";
    ctx.fillRect(tx(n.pos[0]) - 2, ty(n.pos[1]) - 1, 4, 4);
  }
  // Đàn cá
  ctx.fillStyle = "#8ce8ff";
  for (const f of snap.fish || []) {
    ctx.fillRect(tx(f.pos[0]) - 1.5, ty(f.pos[1]) - 1.5, 3, 3);
  }
  // Cá Sấu
  for (const m of snap.monsters || []) {
    ctx.fillStyle = m.state === "chase" ? "#e07bff" : "#ff6e54";
    ctx.beginPath(); ctx.arc(tx(m.pos[0]), ty(m.pos[1]), m.state === "chase" ? 4 : 3, 0, Math.PI * 2); ctx.fill();
  }
  // Người chơi
  if (ppos) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(tx(ppos[0]), ty(ppos[1]), 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ff9f43"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
}

function drawGatherHotbar(w, h, hold, capacity, counts, reqIng) {
  const cap = capacity || 12;
  const slotSz = Math.min(38, Math.max(26, (w - 80) / cap - 5));
  const barW = cap * (slotSz + 4) + 20;
  const bx = (w - barW) / 2, by = h - slotSz - 40;
  const spLimit = spoiledLimit();
  ctx.save();
  roundRect(bx, by - 28, barW, slotSz + 62, 14);
  ctx.fillStyle = "rgba(32, 22, 16, 0.88)";
  ctx.fill();
  ctx.strokeStyle = "#9ce3cf";
  ctx.lineWidth = 1.6;
  ctx.stroke();

  const reqTxt = reqIng
    ? " · Cần: " + Object.entries(reqIng).map(([k, n]) => `${KIND_NAME[k] || k} ${counts[k] || 0}/${n}`).join(" | ")
    : "";
  text(`Giỏ ${hold.length}/${cap}${reqTxt}`, w / 2, by - 8, { size: 15, weight: 700, align: "center", color: "#ffefc8", maxWidth: barW - 16 });

  for (let i = 0; i < cap; i++) {
    const sx0 = bx + 10 + i * (slotSz + 4);
    const it = hold[i];
    const kind = itemKind(it);
    const fresh = itemFresh(it);
    const spoiled = fresh !== null && fresh < spLimit;
    roundRect(sx0, by, slotSz, slotSz, 6);
    ctx.fillStyle = spoiled ? "rgba(180, 50, 40, 0.28)" : "rgba(255, 245, 220, 0.08)";
    ctx.fill();
    ctx.strokeStyle = spoiled ? "#ff6e54" : "rgba(255, 240, 200, 0.25)";
    ctx.lineWidth = spoiled ? 1.6 : 1;
    ctx.stroke();
    if (kind) {
      ctx.globalAlpha = spoiled ? 0.55 : 1;
      ctx.fillStyle = kc(kind);
      ctx.beginPath(); ctx.arc(sx0 + slotSz / 2, by + slotSz * 0.42, slotSz * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.globalAlpha = 1;
      if (fresh !== null) {
        const fw = slotSz - 6;
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(sx0 + 3, by + slotSz - 7, fw, 4);
        ctx.fillStyle = freshColor(fresh);
        ctx.fillRect(sx0 + 3, by + slotSz - 7, fw * Math.max(0, Math.min(1, fresh / 100)), 4);
        text(spoiled ? "Ươn" : `${Math.floor(fresh)}`, sx0 + slotSz / 2, by + slotSz - 9,
          { size: 9, weight: 700, align: "center", color: spoiled ? "#ff9e80" : "#fff5df", outline: OUTLINE });
      }
    }
  }
  text("WASD/Mũi tên: Bơi · E: Hái/Cập bến · Space: Bắt cá · Esc/P: Tạm dừng", w / 2, by + slotSz + 22,
    { size: 13, align: "center", color: "#d5c1a5", maxWidth: w - 24 });
  ctx.restore();
}

// ----- cảnh GATHER: camera 2D bám theo nhân vật -----
function drawGather(w, h, frameTime, alpha) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const p = snap.player;
  const ppos = p ? smoothPos("player:gather", p.pos, alpha) : [X / 2, 5];

  // Zoom ~3x để cảm giác như game hành động 2D, camera bám theo Út Sen
  const s = Math.max(22, Math.min(38, Math.min(w, h) / 20));
  const halfW = w / (2 * s), halfH = h / (2 * s);
  const minCamX = Math.min(X / 2, halfW), maxCamX = Math.max(X / 2, X - halfW);
  const minCamY = Math.min((D - SKY) / 2, -SKY + halfH), maxCamY = Math.max((D - SKY) / 2, D - halfH);
  const tgtX = Math.max(minCamX, Math.min(maxCamX, ppos[0]));
  const tgtY = Math.max(minCamY, Math.min(maxCamY, ppos[1]));
  if (!cam.init) { cam.x = tgtX; cam.y = tgtY; cam.init = true; }
  else { cam.x += (tgtX - cam.x) * alpha; cam.y += (tgtY - cam.y) * alpha; }

  // Rung màn hình nhẹ khi vừa bị Cá Sấu húc hoặc ngạt
  let shakeX = 0, shakeY = 0;
  const hurtEv = !reducedMotion.matches && (snap.events || []).findLast((e) => (e.name === "monster_hit" || e.name === "choke") && snap.tick - e.tick < 18);
  if (hurtEv) {
    const mag = (18 - (snap.tick - hurtEv.tick)) * 0.45;
    shakeX = Math.sin(frameTime * 0.9) * mag;
    shakeY = Math.cos(frameTime * 1.1) * mag;
  }

  const sx = (x) => w / 2 + (x - cam.x) * s + shakeX;
  const sy = (d) => h / 2 + (d - cam.y) * s + shakeY;
  const oy = sy(0);
  const grads = getGatherGrads(w, h, oy, sy(D), sx(0), X, s);

  // Bầu trời Ghibli sáng trong + mây trôi
  if (oy > 0) {
    ctx.fillStyle = grads.sky;
    ctx.fillRect(0, 0, w, Math.min(h, oy));
    const cloudShift = reducedMotion.matches ? 0 : (frameTime / 90) % (w + 180);
    drawCloud((w * 0.15 + cloudShift) % (w + 160) - 80, oy - 3.2 * s, 1.1);
    drawCloud((w * 0.58 + cloudShift * 0.7) % (w + 160) - 80, oy - 4.2 * s, 1.3);
    // Dải cây dừa nước xa xa trên đường chân trời
    ctx.fillStyle = "rgba(65, 104, 70, 0.42)";
    for (let gx = 4; gx < X; gx += 7) {
      const cx = sx(gx);
      if (cx < -60 || cx > w + 60) continue;
      ctx.beginPath();
      ctx.arc(cx, oy, 26, Math.PI, 0);
      ctx.arc(cx + 30, oy, 20, Math.PI, 0);
      ctx.fill();
    }
  }

  // Lòng sông: nước ngọc lam -> xanh thẫm + tia nắng xuyên nước
  ctx.fillStyle = grads.water;
  ctx.fillRect(sx(0), oy, X * s, D * s);

  ctx.save();
  ctx.beginPath();
  ctx.rect(sx(0), oy, X * s, D * s);
  ctx.clip();
  for (const { rx, ray } of grads.rays) {
    ctx.fillStyle = ray;
    ctx.beginPath();
    ctx.moveTo(rx, oy); ctx.lineTo(rx + 4 * s, oy);
    ctx.lineTo(rx + 14 * s, sy(D)); ctx.lineTo(rx + 4 * s, sy(D));
    ctx.closePath(); ctx.fill();
  }

  // Bọt khí trôi nhẹ dưới nước (gom 1 lần vẽ cho mượt)
  if (!reducedMotion.matches) {
    ctx.fillStyle = "rgba(218, 250, 255, 0.25)";
    ctx.beginPath();
    for (const bb of BUBBLES) {
      const by = D - ((bb.phase * 7 + frameTime / (95 / bb.speed)) % D);
      const bx = bb.x + Math.sin(frameTime / 450 + bb.phase) * 0.6;
      const cx = sx(bx), cy = sy(by);
      ctx.moveTo(cx + bb.r, cy);
      ctx.arc(cx, cy, bb.r, 0, Math.PI * 2);
    }
    ctx.fill();
  }

  // Đáy sông cát nâu + rong rêu
  ctx.fillStyle = "#172d27";
  ctx.fillRect(sx(0), sy(D) - 0.8 * s, X * s, 0.8 * s);
  ctx.restore();

  // Sóng lăn tăn mặt nước
  ctx.strokeStyle = "#f2fcff";
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let x = 0; x <= X; x += 2) {
    const wy = oy + (reducedMotion.matches ? 0 : Math.sin(frameTime / 280 + x * 0.45) * 1.5);
    if (x === 0) ctx.moveTo(sx(x), wy); else ctx.lineTo(sx(x), wy);
  }
  ctx.stroke();

  // Vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 5, sy(d) - 3, { size: 10, color: "rgba(255,255,255,0.45)" });
  }

  // Bến gỗ mái lá kiểu Ghibli
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const dockX = sx(dp[0]), dockY = sy(dp[1]);
  const canDock = !snap.finished && p && Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr;
  ctx.save();
  ctx.strokeStyle = OUTLINE;
  ctx.lineWidth = 1.6;
  ctx.fillStyle = "#6e472d";
  ctx.fillRect(dockX - 1.3 * s, dockY, 0.34 * s, 0.9 * s);
  ctx.fillRect(dockX + 0.95 * s, dockY, 0.34 * s, 0.9 * s);
  ctx.fillStyle = "#8c5b3a";
  ctx.fillRect(dockX - 1.6 * s, dockY - 0.48 * s, 3.2 * s, 0.48 * s);
  ctx.strokeRect(dockX - 1.6 * s, dockY - 0.48 * s, 3.2 * s, 0.48 * s);
  // Mái nhà tranh ấm áp
  ctx.fillStyle = "#c96f44";
  ctx.beginPath();
  ctx.moveTo(dockX - 1.9 * s, dockY - 0.55 * s);
  ctx.lineTo(dockX, dockY - 2.4 * s);
  ctx.lineTo(dockX + 1.9 * s, dockY - 0.55 * s);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // Đèn lồng nhỏ treo ở bến
  ctx.fillStyle = "#ffcf66";
  ctx.beginPath(); ctx.arc(dockX + 1.35 * s, dockY - 0.3 * s, 0.2 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();

  if (canDock) {
    ctx.strokeStyle = "#fff0a3";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(dockX, dockY, dr * s, 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.strokeStyle = "rgba(255,235,165,0.55)";
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(dockX, dockY, dr * s, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  text("Bến xuồng", dockX, sy(-2.7), { size: 11, weight: 700, align: "center", color: "#4d2f1a" });

  // Nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    const nx = sx(n.pos[0]), ny = sy(n.pos[1]);
    drawPlantNode(n, nx, ny, s, ready);
    text(KIND_NAME[n.kind] || n.kind, nx, ny - 0.9 * s, { size: 11, weight: 700, align: "center", color: "#2b3d2b" });
    if (!ready && n.regrow_ticks > 0) {
      const rx = nx, ry = ny + 16;
      const total = meta.regrow_s * 60;
      const progress = total > 0 ? Math.max(0, Math.min(1, 1 - n.regrow_ticks / total)) : 0;
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = "rgba(255,255,255,0.28)";
      ctx.beginPath(); ctx.arc(rx, ry, 11, 0, 2 * Math.PI); ctx.stroke();
      ctx.strokeStyle = "#f9de82";
      ctx.beginPath(); ctx.arc(rx, ry, 11, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * progress); ctx.stroke();
      text(Math.ceil(n.regrow_ticks / 60) + "s", rx, ry + 3.5, { size: 10, weight: 700, align: "center" });
    }
    if (!canDock && !snap.finished && ready && snap.harvest_target_id === n.id) {
      marker("[E] Hái", nx, ny - 18, w, "#fff0a3");
    }
  });

  // Đàn cá
  (snap.fish || []).forEach((f, index) => {
    const fpos = smoothPos("fish:" + f.id, f.pos, alpha);
    const fx = sx(fpos[0]), fy = sy(fpos[1]);
    const canCatch = !snap.finished && snap.catch_target_id === f.id;
    const tailSwing = reducedMotion.matches || snap.finished
      ? 0 : Math.sin(frameTime / 130 + index * 1.7) * 0.25 * s;
    drawFishAnime(f, fx, fy, s, canCatch, tailSwing);
    if (canCatch) marker("[Space] Bắt cá", fx, fy - 14, w, "#fff0a3");
  });

function drawCrocodileAnime(m, mx, my, s, frameTime, index) {
  const chasing = m.state === "chase";
  const recoiling = m.state === "recoil";
  const cs = s * 1.05; // kích thước lớn rõ ràng theo camera zoom
  const anim = reducedMotion.matches || snap.finished ? 0 : frameTime;
  const tail = anim ? Math.sin(anim / (chasing ? 85 : 150) + index) * 0.38 * cs : 0;
  const jawOpen = chasing ? (0.28 + (anim ? Math.abs(Math.sin(anim / 110)) * 0.22 : 0)) : 0.08;

  ctx.save();
  ctx.translate(mx, my);
  if (Math.cos(((m.heading_deg || 0) * Math.PI) / 180) < 0) ctx.scale(-1, 1);

  if (chasing) {
    // Hào quang tím đỏ đe dọa khi đang đuổi
    ctx.fillStyle = "rgba(180, 50, 220, 0.22)";
    ctx.beginPath();
    ctx.ellipse(0, 0, 2.9 * cs, 1.2 * cs, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const edge = chasing ? "#e07bff" : recoiling ? "#ffab91" : "#131c15";
  ctx.lineWidth = chasing ? 2.6 : 1.8;
  ctx.lineJoin = "round";

  // Đuôi dài có gai răng cưa
  ctx.fillStyle = "#1d3824";
  ctx.strokeStyle = edge;
  ctx.beginPath();
  ctx.moveTo(-1.0 * cs, -0.28 * cs);
  ctx.lineTo(-2.7 * cs, -0.1 * cs + tail);
  ctx.lineTo(-1.0 * cs, 0.34 * cs);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Thân cá sấu sẫm màu + bụng giáp sáng
  ctx.fillStyle = "#26472e";
  ctx.beginPath();
  ctx.ellipse(0, 0.05 * cs, 1.35 * cs, 0.52 * cs, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = "#6e8f66";
  ctx.beginPath();
  ctx.ellipse(0.05 * cs, 0.28 * cs, 1.05 * cs, 0.22 * cs, 0, 0, Math.PI);
  ctx.fill();

  // Gai sống lưng sắc nhọn
  ctx.fillStyle = "#152619";
  for (let i = -3; i <= 2; i++) {
    const sx0 = i * 0.42 * cs - 0.1 * cs;
    const sy0 = -0.34 * cs + (i < -1 ? tail * 0.35 : 0);
    ctx.beginPath();
    ctx.moveTo(sx0 - 0.14 * cs, sy0 + 0.1 * cs);
    ctx.lineTo(sx0, sy0 - 0.26 * cs);
    ctx.lineTo(sx0 + 0.16 * cs, sy0 + 0.1 * cs);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  // Chân bơi có móng vuốt (Năm Chèo)
  ctx.fillStyle = "#1d3824";
  for (const cx of [-0.65 * cs, 0.45 * cs]) {
    ctx.beginPath();
    ctx.ellipse(cx, 0.48 * cs, 0.24 * cs, 0.14 * cs, 0.4, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }

  // Hàm dưới + răng nanh
  ctx.save();
  ctx.translate(0.95 * cs, 0.12 * cs);
  ctx.rotate(jawOpen);
  ctx.fillStyle = "#2b4f33";
  ctx.beginPath();
  ctx.moveTo(0, -0.08 * cs);
  ctx.lineTo(1.25 * cs, 0.02 * cs);
  ctx.lineTo(1.15 * cs, 0.2 * cs);
  ctx.lineTo(0, 0.22 * cs);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff8e7";
  for (let t = 0.25; t <= 1.05; t += 0.22) {
    ctx.beginPath();
    ctx.moveTo(t * cs - 0.06 * cs, -0.05 * cs);
    ctx.lineTo(t * cs, -0.22 * cs);
    ctx.lineTo(t * cs + 0.06 * cs, -0.05 * cs);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Đầu & hàm trên + răng nanh
  ctx.save();
  ctx.translate(0.9 * cs, -0.05 * cs);
  ctx.rotate(-jawOpen * 0.7);
  ctx.fillStyle = "#26472e";
  ctx.beginPath();
  ctx.moveTo(-0.2 * cs, -0.35 * cs);
  ctx.lineTo(0.45 * cs, -0.38 * cs);
  ctx.lineTo(1.38 * cs, -0.06 * cs);
  ctx.lineTo(1.25 * cs, 0.14 * cs);
  ctx.lineTo(-0.15 * cs, 0.14 * cs);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff8e7";
  for (let t = 0.22; t <= 1.1; t += 0.22) {
    ctx.beginPath();
    ctx.moveTo(t * cs - 0.06 * cs, 0.12 * cs);
    ctx.lineTo(t * cs, 0.3 * cs);
    ctx.lineTo(t * cs + 0.06 * cs, 0.12 * cs);
    ctx.closePath();
    ctx.fill();
  }
  // Mắt đỏ rực / vàng hổ phách + đồng tử dọc sắc lẹm
  ctx.fillStyle = chasing ? "#ff2a4b" : "#ffb300";
  ctx.beginPath(); ctx.ellipse(0.18 * cs, -0.18 * cs, 0.16 * cs, 0.12 * cs, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#12070a";
  ctx.beginPath(); ctx.ellipse(0.2 * cs, -0.18 * cs, 0.04 * cs, 0.1 * cs, 0, 0, Math.PI * 2); ctx.fill();
  // Lông mày giận dữ
  ctx.strokeStyle = "#0e1710";
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(0.02 * cs, -0.34 * cs); ctx.lineTo(0.36 * cs, -0.25 * cs); ctx.stroke();
  ctx.restore();

  ctx.restore();
}

  // Thủy quái (Cá Sấu Năm Chèo)
  (snap.monsters || []).forEach((m, index) => {
    const mpos = smoothPos("monster:" + m.id, m.pos, alpha);
    const mx = sx(mpos[0]), my = sy(mpos[1]);
    drawCrocodileAnime(m, mx, my, s, frameTime, index);
    if (m.state === "chase") warnMarker("Thủy quái!", mx, my - 1.8 * s, w, "#f2b8ff", "#3a194a");
  });

  // Nhân vật Út Sen
  if (p) {
    const px = sx(ppos[0]), py = sy(ppos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) {
      ctx.strokeStyle = "rgba(180,245,255,0.26)";
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (meta.interact_radius && !underwater) {
      ctx.strokeStyle = "rgba(255,245,190,0.45)";
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      drawUtSenSide(px, py, s, p.heading_deg, underwater, frameTime);
      if (underwater) {
        text("Út Sen", px, py + 1.4 * s + 14, { size: 13, weight: 700, align: "center", color: "#fff5df", outline: OUTLINE });
      }
    }
  }

  // Viền đỏ cảnh báo khi bị thương
  if (hurtEv) {
    ctx.strokeStyle = "rgba(255, 60, 60, 0.55)";
    ctx.lineWidth = 16;
    ctx.strokeRect(0, 0, w, h);
  }

  // HUD dạng Game nổi (không che hết màn hình)
  const hold = snap.hold || [];
  const counts = countByKind(hold);
  const capacity = snap.hold_capacity;
  const reqIng = snap.day_plan?.ingredients;
  const fz = hudFont(w, 18);

  // Thẻ trạng thái góc trên-trái
  ctx.save();
  roundRect(12, 12, Math.min(340, w - 24), 102, 14);
  ctx.fillStyle = "rgba(32, 22, 16, 0.86)";
  ctx.fill();
  ctx.strokeStyle = "#9ce3cf";
  ctx.lineWidth = 1.8;
  ctx.stroke();
  const dayTag = snap.day ? `Ngày ${snap.day}/${snap.days || 1} · ` : "";
  text(dayTag + (snap.preview ? "Mẫu" : "Lặn & Hái"), 24, 38, { size: fz, weight: 800, color: "#fff5df" });
  text("⏱ " + fmtTime(snap.time_left_ticks || 0), Math.min(336, w - 24), 38,
    { size: fz, weight: 700, align: "right", color: (snap.time_left_ticks || 0) <= 30 * 60 ? "#ff8a72" : "#9ce3cf" });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const fraction = p.oxygen_ticks / p.oxygen_max_ticks;
    const low = fraction < 0.25;
    const color = low ? (highContrast ? HC_WARN : "#ff6e54") : "#7ee3d2";
    text(`Oxy ${Math.ceil(p.oxygen_ticks / 60)}s${low ? " · Hết hơi!" : ""}`, 24, 66, { size: 16, color, weight: 700 });
    pillBar(24, 76, 175, 14, fraction, color);
  }
  if (p?.hp !== undefined && p.hp_max) {
    let hearts = "";
    for (let i = 0; i < p.hp_max; i++) hearts += i < p.hp ? "♥ " : "♡ ";
    text(hearts.trim(), Math.min(336, w - 24), 86, { size: 22, align: "right", color: "#ff858d", outline: OUTLINE });
  }
  ctx.restore();

  // Bản đồ thu nhỏ & nút Tạm dừng góc trên-phải
  drawMinimap(w, h, X, D, dp, ppos);
  drawButton(w - 130, 12, 116, 32, "Tạm dừng [P]", "rgba(32, 22, 16, 0.86)", "#ffd68b", "#fff5df", togglePause, 14);

  if ((snap.monsters || []).some((m) => m.state === "chase")) {
    warnMarker("Thủy quái!", w / 2, 46, w, "#f2b8ff", "#3a194a");
  }
  // Tương phản cao: "Hết hơi!" có thêm thẻ cảnh báo giữa màn hình, không chỉ đổi màu dòng Oxy.
  if (highContrast && p?.oxygen_max_ticks && p.oxygen_ticks / p.oxygen_max_ticks < 0.25) {
    warnMarker("Hết hơi!", w / 2, 88, w);
  }

  // Thanh giỏ đồ & điều khiển phía dưới
  drawGatherHotbar(w, h, hold, capacity, counts, reqIng);
  if (canDock) {
    marker("[E] Cập bến · Kết thúc buổi sáng", sx(dp[0]), sy(-2.9), w, "#ffe680");
  } else if (p && !snap.finished && ((capacity && hold.length >= capacity) || snap.time_left_ticks <= 30 * 60)) {
    const dx = dp[0] - p.pos[0], dy = dp[1] - p.pos[1];
    const directions = ["→", "↘", "↓", "↙", "←", "↖", "↑", "↗"];
    const direction = directions[(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8];
    marker(direction + " Về bến", sx(p.pos[0]), sy(p.pos[1]) + 43, w, "#fff0a3");
  }
  if (!snap.finished) {
    for (const event of snap.events || []) {
      const reward = gatherReward(event);
      if (!reward) continue;
      const age = snap.preview ? (frameTime % 2500) * 60 / 1000 : snap.tick - event.tick;
      if (age < 0 || age >= 72) continue;
      const rise = reducedMotion.matches ? 0 : 26 * age / 72;
      ctx.save();
      ctx.globalAlpha = Math.min(1, (72 - age) / 48);
      marker(reward.label, sx(reward.pos[0]), sy(reward.pos[1]) + 52 - rise, w, "#a5ded0");
      ctx.restore();
    }
  }
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h, frameTime, alpha) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1];
  const action = snap.finished ? null : snap.interact_target;
  const pickupId = action?.action === "dish_picked" ? action.id : null;
  const serveId = action?.action === "served" ? action.id : null;
  const failure = (snap.events || []).findLast((event) => event.name === "cook_blocked" && snap.tick - event.tick < 120);
  const missing = Object.entries(failure?.data?.missing || snap.missing_ingredients || {})
    .filter(([, count]) => count > 0)
    .map(([kind, count]) => `${count} ${KIND_NAME[kind] || kind}`).join(" · ");
  const shortageStove = failure?.data?.stove_id || (snap.stoves || []).find((stove) => stove.state === "idle")?.id;

  const s = Math.max(1, Math.min((w - 56) / X, (h - 210) / Z));
  const ox = (w - s * X) / 2, oy = Math.max(118, (h - s * Z) / 2 - 10);
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // Mặt sông đêm toàn màn hình + phản chiếu ánh đèn
  const night = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w * 0.72);
  night.addColorStop(0, "#19303f");
  night.addColorStop(1, "#091219");
  ctx.fillStyle = night;
  ctx.fillRect(0, 0, w, h);

  // Gợn sóng sông đêm nhẹ
  if (!reducedMotion.matches) {
    ctx.strokeStyle = "rgba(140, 210, 235, 0.08)";
    ctx.lineWidth = 1.5;
    for (let r = 0; r < 6; r++) {
      const ry = ((r * 130 + frameTime * 0.02) % h);
      const rx = ((r * 230 + Math.sin(frameTime / 900 + r) * 30) % w);
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + 60, ry); ctx.stroke();
    }
  }

  // Sàn gỗ quán nổi ấm áp
  const floor = ctx.createLinearGradient(sx(0), sy(Z), sx(X), sy(0));
  floor.addColorStop(0, "#8d5c38");
  floor.addColorStop(1, "#5c3921");
  ctx.fillStyle = floor;
  ctx.fillRect(sx(0), sy(Z), X * s, Z * s);

  ctx.strokeStyle = "rgba(38, 20, 10, 0.35)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let row = 1; row < Z; row++) {
    ctx.moveTo(sx(0), sy(row)); ctx.lineTo(sx(X), sy(row));
  }
  ctx.stroke();

  // Viền tre & đèn lồng ấm quanh sàn quán
  ctx.strokeStyle = "#d9a462";
  ctx.lineWidth = 4;
  ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  const pulse = reducedMotion.matches ? 1 : 0.85 + 0.15 * Math.sin(frameTime / 350);
  for (let lx = 2; lx < X; lx += 4) {
    for (const lz of [0, Z]) {
      const gx = sx(lx), gy = sy(lz);
      const glow = ctx.createRadialGradient(gx, gy, 2, gx, gy, 24 * pulse);
      glow.addColorStop(0, "rgba(255, 198, 92, 0.45)");
      glow.addColorStop(1, "rgba(255, 198, 92, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(gx, gy, 24 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f26b4f";
      ctx.strokeStyle = OUTLINE;
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(gx, gy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  // Bếp lò truyền thống
  (snap.stoves || []).forEach((st) => {
    const x = sx(st.pos[0]), y = sy(st.pos[1]);
    const col = st.state === "cooking" ? "#ffbe5c" : st.state === "ready" ? "#a8e07c" : "#d9cbbd";
    ctx.save();
    roundRect(x - 0.85 * s, y - 0.7 * s, 1.7 * s, 1.4 * s, 8);
    ctx.fillStyle = "#3d2c22";
    ctx.fill();
    ctx.strokeStyle = pickupId === st.id && st.state === "ready" ? "#fff0a3" : OUTLINE;
    ctx.lineWidth = pickupId === st.id && st.state === "ready" ? 3 : 1.8;
    ctx.stroke();

    // Miệng bếp / lửa hoặc nồi chín
    ctx.fillStyle = st.state === "cooking" ? "#ff7733" : st.state === "ready" ? "#98d468" : "#5e4a3d";
    ctx.beginPath(); ctx.arc(x, y - 0.1 * s, 0.42 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (st.state === "cooking" && !reducedMotion.matches) {
      // Hơi nóng bốc lên
      ctx.strokeStyle = "rgba(255, 240, 210, 0.55)";
      ctx.lineWidth = 1.8;
      const wisp = Math.sin(frameTime / 180) * 4;
      ctx.beginPath();
      ctx.moveTo(x - 6, y - 0.35 * s);
      ctx.quadraticCurveTo(x - 6 + wisp, y - 0.6 * s, x - 4, y - 0.85 * s);
      ctx.moveTo(x + 6, y - 0.35 * s);
      ctx.quadraticCurveTo(x + 6 - wisp, y - 0.6 * s, x + 4, y - 0.85 * s);
      ctx.stroke();
    }
    text("Bếp " + st.id, x, y + 0.52 * s, { size: 11, weight: 700, align: "center", color: col, maxWidth: 1.6 * s });
    ctx.restore();

    let status = "Bếp trống";
    if (st.state === "cooking") status = st.cook_ticks_left === undefined ? "Đang nấu" : `Đang nấu · ${Math.ceil(st.cook_ticks_left / 60)}s`;
    if (st.state === "ready") status = "Món đã chín";
    const canPick = pickupId === st.id && st.state === "ready";
    const dish = typeof st.dish === "string" ? st.dish : st.dish?.dish_id;
    const dishPrice = typeof st.dish === "object" && Number.isFinite(st.dish?.base_price) ? ` (${st.dish.base_price}k)` : "";
    const label = canPick ? `[E] Lấy món${dishPrice}`
      : missing && shortageStove === st.id ? "Thiếu " + missing
      : dish ? `${dishName(dish)}${dishPrice} · ${status}` : status;
    marker(label, x, y - 0.95 * s, w, canPick ? "#fff0a3" : "#fff5df");
  });

  // Bàn gỗ tròn + Khách anime
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const x = sx(tb.pos[0]), y = sy(tb.pos[1]);
    const canServe = serveId === tb.id;
    ctx.save();
    ctx.fillStyle = "#dfa868";
    ctx.strokeStyle = canServe ? "#fff0a3" : OUTLINE;
    ctx.lineWidth = canServe ? 3 : 2;
    ctx.beginPath(); ctx.arc(x, y, 0.92 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(90, 50, 20, 0.25)";
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(x, y, 0.7 * s, 0, Math.PI * 2); ctx.stroke();
    text("Bàn " + tb.id, x, y + 4, { size: 12, weight: 700, align: "center", color: "#302117", maxWidth: 1.5 * s });
    ctx.restore();

    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      const eating = c.state === "eating";
      const remaining = c.patience_ticks_left;
      const urgent = !eating && remaining !== undefined && remaining <= patMax * 0.2;

      // Khách (nhìn từ trên xuống: vai + đầu + tóc)
      ctx.save();
      ctx.strokeStyle = OUTLINE;
      ctx.lineWidth = 1.8;
      ctx.fillStyle = eating ? "#7cc982" : urgent ? "#f08575" : "#f2b8c6";
      ctx.beginPath(); ctx.ellipse(cx, cy, 0.58 * s, 0.44 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#36272e";
      ctx.beginPath(); ctx.arc(cx, cy - 0.05 * s, 0.34 * s, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      const name = c.dish_id ? dishName(c.dish_id) : "Món gọi";
      const cPrice = Number.isFinite(c.base_price) && c.base_price > 0 ? ` · ${c.base_price}k` : "";
      const wait = remaining === undefined ? "" : ` · ${Math.ceil(remaining / 60)}s`;
      const status = urgent ? (w < 540 ? "Sắp rời bàn" : name + " · Sắp rời bàn") : "Chờ " + name;
      if (urgent && !eating) warnMarker(status + wait, cx, cy - 0.65 * s, w, "#ffab91");
      else marker(eating ? `Đang ăn${cPrice}` : status + wait, cx, cy - 0.65 * s, w, urgent ? "#ffab91" : "#fff5df");
      if (!eating && remaining !== undefined) {
        pillBar(cx - 0.85 * s, cy + 0.6 * s, 1.7 * s, 7, remaining / patMax, urgent ? "#ff7a63" : "#ffc171");
      }
      if (canServe) marker("[E] Phục vụ", x, y + Math.min(s, 22), w, "#fff0a3");
    }
  });

  // Út Sen (nhìn từ trên xuống)
  const p = snap.player;
  if (p) {
    const ppos = smoothPos("player:quan", p.pos, alpha);
    const px = sx(ppos[0]), py = sy(ppos[1]);
    if (meta.interact_radius) {
      ctx.strokeStyle = "rgba(255, 240, 200, 0.35)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.save();
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 1.8;
    // Vai áo + nón lá nhìn từ trên xuống
    ctx.fillStyle = "#8cd6c5";
    ctx.beginPath(); ctx.ellipse(px, py, 0.52 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ecd396";
    ctx.beginPath(); ctx.arc(px, py, 0.42 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#c96f44";
    ctx.beginPath(); ctx.arc(px, py, 0.1 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      // Tô/đĩa món ăn đang bưng
      ctx.fillStyle = "#fff5e1";
      ctx.beginPath(); ctx.arc(px + 0.42 * s, py - 0.2 * s, 0.24 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ff9f43";
      ctx.beginPath(); ctx.arc(px + 0.42 * s, py - 0.2 * s, 0.14 * s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    text("Út Sen", px, py + 0.58 * s + 13, { size: 12, weight: 700, align: "center", color: "#e2fff5", outline: OUTLINE });
  }

  // HUD Quán nổi kiểu game (thẻ trên-trái + nút tạm dừng + thanh kho dưới-giữa)
  const fz = hudFont(w, 18);
  const hand = typeof snap.hand === "string" ? snap.hand : snap.hand?.dish_id;
  const handPrice = typeof snap.hand === "object" && Number.isFinite(snap.hand?.base_price) ? ` (${snap.hand.base_price}k)` : "";
  const handLabel = snap.hand ? "Đang bưng: " + (hand ? dishName(hand) + handPrice : "Món ăn") : "Tay trống";

  ctx.save();
  roundRect(12, 12, Math.min(450, w - 150), 96, 14);
  ctx.fillStyle = "rgba(32, 22, 16, 0.88)";
  ctx.fill();
  ctx.strokeStyle = "#ffd68b";
  ctx.lineWidth = 1.8;
  ctx.stroke();

  const dayTag = snap.day ? `Ngày ${snap.day}/${snap.days || 1} · ` : "";
  text(dayTag + (snap.preview ? "Quán mẫu" : "Quán Đèn Lồng"), 24, 38, { size: fz, weight: 800, color: "#fff5df" });
  text("⏱ " + fmtTime(snap.time_left_ticks || 0), Math.min(446, w - 154), 38,
    { size: fz, weight: 700, align: "right", color: (snap.time_left_ticks || 0) <= 30 * 60 ? "#ff8a72" : "#ffd68b" });
  text(`Tiền ${snap.money ?? 0}k · Uy tín ${(snap.reputation ?? 0).toFixed(1)} · Điểm ${snap.score ?? 0}`,
    24, 66, { size: 16, color: "#ffd68b", weight: 700, maxWidth: Math.min(420, w - 170) });
  text(handLabel, 24, 92, { size: 16, color: snap.hand ? "#9ce3cf" : "#dccbb7", weight: 700 });
  ctx.restore();

  drawButton(w - 130, 12, 116, 36, "Tạm dừng [P]", "rgba(32, 22, 16, 0.88)", "#ffd68b", "#fff5df", togglePause, 14);

  // Thanh kho nguyên liệu (hỗ trợ cả v1.2 cá thể {id, kind, fresh} và v1.1 đếm)
  const spLimit = spoiledLimit();
  let stockText = "Kho trống";
  let hasSpoiled = false;
  if (Array.isArray(snap.stock)) {
    if (snap.stock.length) {
      hasSpoiled = snap.stock.some((it) => (it.fresh ?? 100) < spLimit);
      stockText = "Kho: " + snap.stock.slice(0, 8).map((it) => {
        const f = Math.floor(it.fresh ?? 100);
        return `${it.id} ${KIND_NAME[it.kind] || it.kind} ${f < spLimit ? "Ươn" : f + "%"}`;
      }).join(" · ") + (snap.stock.length > 8 ? ` (+${snap.stock.length - 8})` : "");
    }
  } else {
    const stockEntries = Object.entries(snap.stock || {}).filter(([, c]) => c > 0);
    if (stockEntries.length) {
      stockText = "Kho: " + stockEntries.map(([k, c]) => `${KIND_NAME[k] || k} ×${c}`).join(" · ");
    }
  }
  const barW = Math.min(w - 24, 860);
  const bx = (w - barW) / 2, by = h - 72;
  ctx.save();
  roundRect(bx, by, barW, 60, 14);
  ctx.fillStyle = "rgba(32, 22, 16, 0.88)";
  ctx.fill();
  ctx.strokeStyle = hasSpoiled ? "#ff6e54" : "#ffd68b";
  ctx.lineWidth = 1.6;
  ctx.stroke();
  text(stockText, w / 2, by + 24, { size: 15, weight: 700, align: "center", color: hasSpoiled ? "#ffab91" : "#ffefc8", maxWidth: barW - 24 });
  text("WASD/Mũi tên: Đi · E: Nấu / Lấy món / Phục vụ · Esc/P: Tạm dừng · R: Chơi lại",
    w / 2, by + 48, { size: 13, align: "center", color: "#d5c1a5", maxWidth: barW - 24 });
  ctx.restore();
}

function drawShop(w, h) {
  const fz = hudFont(w, 18);
  const top = HUD_TOP, bottom = footerHeight(w);
  const bg = ctx.createLinearGradient(0, top, 0, h - bottom);
  bg.addColorStop(0, "#1d2c36");
  bg.addColorStop(1, "#121a21");
  ctx.fillStyle = bg;
  ctx.fillRect(0, top, w, h - top - bottom);

  hud(w, h, "Cửa hàng Nâng cấp", "#ffd68b",
    `Kho tồn: ${itemSummary(snap.stock || {}) || "Trống"} · Nâng cấp có hiệu lực từ ngày mai`,
    ["Phím [1] Mua Bình Oxy · [2] Mua Máu", "[E] hoặc [Enter] Sang ngày mới"]);

  text(`Tiền hiện có: ${snap.money ?? 0}k · Uy tín ${(snap.reputation ?? 0).toFixed(1)}`,
    16, 64, { size: fz, color: "#9ce3cf", weight: 700 });

  const ups = snap.shop_meta?.upgrades || {};
  const curUps = snap.upgrades || {};
  const cards = [
    { key: "oxygen", title: "[1] Bình Oxy", desc: (u) => `Oxy tối đa: ${u.oxygen_max_s}s` },
    { key: "hp", title: "[2] Tăng Máu", desc: (u) => `Máu tối đa: ${u.hp_max}` },
  ];
  const cw = Math.min(340, (w - 64) / 2), ch = 220;
  const startX = (w - (cw * 2 + 24)) / 2, cy = top + Math.max(24, (h - top - bottom - ch - 76) / 2);

  cards.forEach((c, idx) => {
    const cx = startX + idx * (cw + 24);
    const levels = (ups[c.key] || []).slice().sort((a, b) => a.level - b.level);
    const curLvl = curUps[c.key] || 0;
    const nxt = levels.find((u) => u.level === curLvl + 1);
    roundRect(cx, cy, cw, ch, 18);
    ctx.fillStyle = "#332218";
    ctx.fill();
    ctx.strokeStyle = "#f2c97d";
    ctx.lineWidth = 2;
    ctx.stroke();

    text(c.title, cx + cw / 2, cy + 44, { size: 22, weight: 800, align: "center", color: "#fff5df" });
    text(`Cấp hiện tại: ${curLvl}`, cx + cw / 2, cy + 80, { size: 18, align: "center", color: "#9ce3cf" });
    if (nxt) {
      text(c.desc(nxt), cx + cw / 2, cy + 114, { size: 18, align: "center", color: "#ffd68b" });
      const canBuy = (snap.money ?? 0) >= nxt.price;
      drawButton(cx + 28, cy + 144, cw - 56, 50,
        canBuy ? `Mua (${nxt.price}k)` : `Thiếu tiền (${nxt.price}k)`,
        canBuy ? "#4ea8a1" : "#4a3c35", canBuy ? "#fff0a3" : "#8d7b70", "#ffffff",
        () => { if (canBuy) buyUpgrade(c.key); }, 18);
    } else {
      text("Đã đạt cấp tối đa", cx + cw / 2, cy + 128, { size: 18, weight: 700, align: "center", color: "#a5ded0" });
    }
  });

  drawButton(w / 2 - 150, cy + ch + 24, 300, 52, "Xong · Sang ngày mới [E]",
    "#c96f44", "#fff0a3", "#ffffff", finishShop, 18);
}

let lastFrameTime = 0;
function frame(frameTime) {
  requestAnimationFrame(frame);
  uiButtons = [];
  const dt = lastFrameTime ? Math.min(0.05, Math.max(0, (frameTime - lastFrameTime) / 1000)) : 1 / 60;
  lastFrameTime = frameTime;
  const alpha = 1 - Math.exp(-24 * dt);
  const [w, h] = fit();
  ctx.fillStyle = "#0e1820";
  ctx.fillRect(0, 0, w, h);
  if (snap) {
    const ph = snap.phase || snap.mode;
    if (ph === "shop") drawShop(w, h);
    else if (ph === "quan") drawQuan(w, h, frameTime, alpha);
    else drawGather(w, h, frameTime, alpha);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 20 });
  }
}
requestAnimationFrame(frame);
</script>
